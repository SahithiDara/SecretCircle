<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secret Circle</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- Animated Background -->
    <div class="background">
        <div class="blob blob1"></div>
        <div class="blob blob2"></div>
        <div class="blob blob3"></div>
    </div>

    <!-- ================= LANDING ================= -->
    <section id="landing" class="screen active">

        <div class="logo">🎉</div>

        <h1>Secret Circle</h1>

        <p class="tagline">
            A night where secrets become memories.
        </p>

        <button id="startBtn" class="landingBtn">
            Let's Go
        </button>

    </section>

    <!-- ================= REGISTER ================= -->
    <section id="register" class="screen">

        <div class="card">

            <h2>Welcome 👋</h2>

            <input
                id="playerName"
                type="text"
                placeholder="Enter your name"
                maxlength="20">

            <div class="genderContainer">

                <label class="genderOption">
                    <input
                        type="radio"
                        name="gender"
                        value="Boy">
                    Boy
                </label>

                <label class="genderOption">
                    <input
                        type="radio"
                        name="gender"
                        value="Girl">
                    Girl
                </label>

            </div>

            <button id="continueBtn">
                Continue
            </button>

        </div>

    </section>

    <!-- ================= WAITING ================= -->
    <section id="waiting" class="screen">

        <div class="card">

        <h2 id="welcomeText">
            Welcome
        </h2>

        <p id="waitingRoundText">
            Waiting for Round 1
        </p>

        <div class="status waitingStatus">
            ⏳ Waiting for the host to start voting.
        </div>

        </div>

    </section>

    <!-- ================= VOTING ================= -->
    <section id="voting" class="screen">

        <div class="card">

            <h2 id="roundTitle">
                Round 1
            </h2>

            <p>
                Listen to the host and vote below.
            </p>

            <div id="optionsContainer">

                <!-- Dynamic options from Firebase -->

            </div>

            <button id="submitVoteBtn">
                Submit Vote
            </button>

        </div>

    </section>

    <!-- ================= SUBMITTED ================= -->
    <section id="submitted" class="screen">

        <div class="card">

        <h2>
            ✅ Vote Submitted
        </h2>

        <p id="submittedRoundText">
            Round 1
        </p>

        <p>
            Please wait for the host to announce the results.
        </p>

        </div>

    </section>

    <script type="module" src="js/app.js"></script>

</body>

</html>
